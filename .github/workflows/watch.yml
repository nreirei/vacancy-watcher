name: JKK空室監視

"on":
  schedule:
    # UTC表記（JST = UTC+9）。12時台は除外
    - cron: "32-57/5 0 * * *"    # JST 9:32-9:57
    - cron: "2-57/5 1-2 * * *"   # JST 10:02-11:57
    - cron: "2-57/5 4-7 * * *"   # JST 13:02-16:57
    - cron: "2-32/5 8 * * *"     # JST 17:02-17:32

  workflow_dispatch:
    inputs:
      dry_run:
        description: "通知を送らずに結果だけ確認する"
        type: boolean
        default: true
      debug:
        description: "スクショとHTMLを保存する"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: jkk-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JKK_SALT: ${{ secrets.JKK_SALT }}
          JKK_AREAS: ${{ secrets.JKK_AREAS }}
          JKK_KEYWORDS: ${{ secrets.JKK_KEYWORDS }}
          JKK_MAX_RENT: ${{ secrets.JKK_MAX_RENT }}
          JKK_LAYOUTS: ${{ secrets.JKK_LAYOUTS }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          python jkk_watch.py $ARGS

      - name: upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: save state
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state"
          git push
